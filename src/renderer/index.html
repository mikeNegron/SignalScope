<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta
    http-equiv="Content-Security-Policy"
    content="
      default-src 'self';
      script-src 'self' 'unsafe-inline';
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src https://fonts.gstatic.com;
      connect-src ws://localhost:*;
    "
  />

  <title>SignalScope</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- esbuild emits this from `import "./styles/global.css"` in index.jsx.
       Without this link the bundled CSS never loads (spinner removal,
       scrollbar theming, range-slider thumb, etc. all silently no-op). -->
  <link rel="stylesheet" href="bundle.css" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body,
    #root {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #09090B;
    }

    body {
      font-family: "IBM Plex Sans", system-ui, sans-serif;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    .app-titlebar {
      height: 30px;
      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: space-between;

      background: #111116;
      border-bottom: 1px solid #27272A;

      -webkit-app-region: drag;
      /* app-region: drag; */

      user-select: none;
    }

    .app-titlebar-title {
      padding-left: 12px;

      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: -0.02em;

      color: #A1A1AA;
    }

    .app-titlebar-controls {
      height: 100%;
      display: flex;

      -webkit-app-region: no-drag;
      /* app-region: no-drag; */
    }

    .titlebar-button {
      width: 44px;
      height: 100%;

      border: none;
      outline: none;
      background: transparent;
      color: #A1A1AA;

      font-family: "IBM Plex Mono", monospace;
      font-size: 16px;
      line-height: 1;

      cursor: pointer;

      -webkit-app-region: no-drag;
      /* app-region: no-drag; */
    }

    .titlebar-button:hover {
      background: #27272A;
      color: #F4F4F5;
    }

    .titlebar-button-close:hover {
      background: #DC2626;
      color: white;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script src="bundle.js"></script>
</body>
</html>
